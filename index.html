<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Valentine ❤️</title>

<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        text-align: center;
    }

    .card {
        background: #fff;
        padding: 25px;
        border-radius: 20px;
        width: 90%;
        max-width: 420px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        position: relative;
        z-index: 2;
        animation: fade 0.6s ease;
    }

    img {
        width: 150px;
        margin-bottom: 15px;
    }

    h1 {
        color: #ff4d6d;
    }

    p {
        color: #555;
        font-size: 15px;
    }

    .buttons {
        margin-top: 20px;
        position: relative;
        height: 60px;
    }

    button {
        padding: 10px 20px;
        border: none;
        border-radius: 20px;
        font-size: 16px;
        cursor: pointer;
        margin: 5px;
        position: relative;
    }

    .yes {
        background: #ff4d6d;
        color: white;
    }

    .no {
        background: #ddd;
        position: absolute;
    }

    /* Gallery */
    .gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 15px;
    }

    .gallery img {
        width: 100%;
        border-radius: 15px;
    }

    /* Heart rain */
    .heart {
        position: absolute;
        color: #ff4d6d;
        font-size: 20px;
        animation: fall linear infinite;
        opacity: 0.8;
        z-index: 1;
    }

    @keyframes fall {
        0% { transform: translateY(-10vh); opacity: 1; }
        100% { transform: translateY(110vh); opacity: 0; }
    }

    @keyframes fade {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }
</style>
</head>

<body>

<div class="card">
   <img id="mainImage" src="pic1.jpg">

    <h1 id="title">Will you be mine? 💖</h1>
    <p id="text">Life is beautiful, but it becomes magical when I imagine it with you.</p>

    <div id="extraContent"></div>

    <div class="buttons" id="buttons">
        <button class="yes" onclick="nextSlide()">YES 💕</button>
        <button class="no" id="noBtn">NO 🙈</button>
    </div>
</div>

<script>
let slide = 0;

const slides = [
    {
        title: "Are you sure? 🥺",
        text: "Because my heart already chose you, and it’s not ready to choose anyone else.",
       img: "pic2.jpg"

    },
    {
        title: "Think again 💭",
        text: "Every smile, every laugh, every moment feels special with you.",
       img: "pic3.jpg"
    },
    {
        title: "One last time ❤️",
        text: "I promise love, care, respect, and endless memories together.",
        img: "https://i.imgur.com/oYiTqum.png"
    },
    {
        title: "Forever starts now 💍",
        text: "So… will you choose me today, tomorrow, and always?",
        forever: true
    },
    {
        title: "Happy Valentine’s Day 💘",
        text: "You are my today, my tomorrow, and every heartbeat in between ❤️",
        final: true,
      gallery: [
    "pic1.jpg",
    "pic2.jpg",
    "pic3.jpg",
    "pic4.jpg"
]

    }
];

function nextSlide() {
    if (slide >= slides.length) return;

    const data = slides[slide];

    // Update text
    document.getElementById("title").innerText = data.title;
    document.getElementById("text").innerText = data.text;

    const mainImage = document.getElementById("mainImage");
    const extra = document.getElementById("extraContent");
    const buttons = document.getElementById("buttons");

    extra.innerHTML = "";

    // If normal slide with image
    if (data.img) {
        mainImage.style.display = "block";
        mainImage.src = data.img;
        buttons.innerHTML = `
            <button class="yes" onclick="nextSlide()">YES 💕</button>
            <button class="no" id="noBtn">NO 🙈</button>
        `;
        setupNoButton();
    }

    // Forever slide (no image)
    else if (data.forever) {
        mainImage.style.display = "none";
        buttons.innerHTML = `
            <button class="yes" onclick="nextSlide()">YES FOREVER 💍❤️</button>
        `;
    }

    // Final gallery slide
    else if (data.final) {
        mainImage.style.display = "none";

        let galleryHTML = "<div class='gallery'>";
        data.gallery.forEach(img => {
            galleryHTML += `<img src="${img}">`;
        });
        galleryHTML += "</div>";

        extra.innerHTML = galleryHTML;

        buttons.innerHTML = `
            <button class="yes">LOVE YOU ❤️</button>
        `;
    }

    slide++;
}
function setupNoButton() {
    const noBtn = document.getElementById("noBtn");
    if (!noBtn) return;

    function moveButton() {
        const card = document.querySelector(".card");
        const cardRect = card.getBoundingClientRect();

        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;

        const maxX = cardRect.width - btnWidth - 20;
        const maxY = cardRect.height - btnHeight - 20;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        noBtn.style.position = "absolute";
        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";
    }

    // Desktop
    noBtn.addEventListener("mouseover", moveButton);

    // Mobile
    noBtn.addEventListener("touchstart", function(e) {
        e.preventDefault();
        moveButton();
    });
}
